services:
  omnistream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnistream
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - pangolin_frontend

networks:
  pangolin_frontend:
    external: true
    name: pangolin_frontend
